# Monash Moodle (Okta login — run: python -m attendance_crawler auth moodle)
moodle_base_url: "https://learning.monash.edu"

units:
  - code: ETM1005
    collect_enabled: false
    # Session numbers between date and time in the digest (Tutorial | date | 03 | time | code)
    my_sessions:
      tutorial: ["03"]
    moodle_course_id: 44365
    # Week N → section = week1_section + (N-1) * step (Monash: week1=8, +4 → 8,12,16,…)
    moodle_week1_section: 8
    moodle_week_section_step: 4
    moodle_week_count: 12

  - code: FIT2109
    # Gmail server-side filter (subject only); newer_than:{lookback}d is appended in code
    gmail_query: 'subject:FIT2109 subject:"Attendance code"'
    gmail_subject_pattern: "FIT2109.*Attendance\\s+code"
    my_sessions:
      tutorial: ["06"]
      workshop: ["03_OnlineRealTime"]

  - code: FIT2102
    ed_course_id: 36340
    ed_thread_title_pattern: "Week\\s*\\d+\\s*Attendance\\s*Codes?"
    ed_author_name: "Tan Choon Ling"
    my_sessions:
      tutorial: ["06"]
      workshop: ["01"]

code_patterns:
  # Require ":" after "attendance code" so subjects don't match the word "code"
  - "(?i)attendance\\s+code\\s*:\\s*([A-Za-z0-9-]{4,16})"
  - "(?i)(?:\\d{1,2}:\\d{2}\\s*(?:AM|PM))\\s+([A-Z0-9]{5})\\b"

collect:
  lookback_days: 7
  # EdStem has no server-side date filter; we list recent threads (sort=new) and skip older than this.
  edstem_lookback_weeks: 1.5

hermes:
  lookback_days: 7
  silent_when_empty: true

# OpenRouter LLM extraction (set OPENROUTER_API_KEY in .env)
# Model: openrouter/free picks a free model per request (vision when needed).
# Or use a specific free slug, e.g. meta-llama/llama-3.2-3b-instruct:free
llm:
  enabled: true
  only_when_regex_empty: true
  model: openrouter/free
  # Cap tokens so OpenRouter does not reject requests (default 16k can hit credit limits)
  max_tokens: 2048
