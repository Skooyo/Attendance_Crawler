[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-crawler"
version = "0.1.0"
description = "Collect attendance codes from Moodle, EdStem, and Gmail"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "playwright>=1.40",
]

[project.scripts]
attendance-crawler = "attendance_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
